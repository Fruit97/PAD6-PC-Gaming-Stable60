name: Build RootGaming VM debug APK
on:
  push:
    branches:
      - root-gaming-vm-lab-v04
    paths:
      - 'rootgaming-vm/**'
      - '.github/workflows/build-rootgaming-vm.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirm Android SDK available
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          command -v sdkmanager
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Unpack app source
        run: |
          python -m pip install brotli
          python - <<'PY'
          from pathlib import Path
          import base64, brotli, io, tarfile
          data = base64.b64decode(Path('rootgaming-vm/build-source.txt').read_text().strip())
          archive = brotli.decompress(data)
          Path('project').mkdir(exist_ok=True)
          with tarfile.open(fileobj=io.BytesIO(archive),mode='r:') as tf:
              tf.extractall(path='project', filter='data')
          print('Unpacked',len(archive),'bytes of app sources')
          PY
      - name: Build Android debug APK
        run: |
          cd project
          gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: RootGamingVMLab-v0.4-debug-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
