name: Build Pad6 Game Booster APK
on:
  push:
    branches: [main]
    paths:
      - 'game-booster/**'
      - '.github/workflows/build-game-booster.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Inspect preinstalled Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -1 "$ANDROID_HOME/platforms" || true
          ls -1 "$ANDROID_HOME/build-tools" || true
          if [ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" ]; then
            echo "Android API 35 is not preinstalled; installing platform..."
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' || true
          fi
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile debug APK
        working-directory: game-booster
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Publish APK
        uses: actions/upload-artifact@v4
        with:
          name: Pad6-Game-Booster-APK
          path: game-booster/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
