name: Build NSO FPS Analyzer APK
on:
  push:
    branches:
      - feature/nso-fps-analyzer-v1
    paths:
      - "nso-analyzer/**"
      - ".github/workflows/nso-fps-analyzer.yml"
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'nso-analyzer/**'
      - '.github/workflows/nso-fps-analyzer.yml'
permissions:
  contents: read
jobs:
  debug-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Configure Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android API 35
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Configure Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build APK
        shell: bash
        run: gradle --no-daemon -p nso-analyzer :app:assembleDebug --stacktrace
      - name: Validate APK
        shell: bash
        run: |
          set -euo pipefail
          APK=nso-analyzer/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" | tail -1
          sha256sum "$APK"
          ls -lh "$APK"
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: NSO-FPS-Analyzer-Android-APK
          path: nso-analyzer/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
