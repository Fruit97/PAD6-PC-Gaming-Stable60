# PAD6 PC Gaming - Xiaomi Pad 6 customized version of GPL-3.0 DroidDeck.
# One-file workflow: contains the patch bundle so no other files are required.
# Upstream commit pinned to 6e57af02af31547d19c5007087f869524d1e05a4.
# The build is attempted by GitHub, not tested on any user's physical tablet.
name: PAD6 PC Gaming Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/pad6-build.yml

permissions:
  contents: read

jobs:
  native-apk:
    name: Full ARM64 Steam/Proton APK
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Checkout this build repository
        uses: actions/checkout@v4
      - name: Prepare Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        uses: android-actions/setup-android@v3
      - name: Prepare native build packages
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zstd git unzip python3 python3-venv curl xz-utils cmake ninja-build build-essential pkg-config
          if ! command -v rustup >/dev/null; then
            echo 'Rustup is not installed on the runner' >&2; exit 1
          fi
          rustup default stable
          docker info >/dev/null
          gh --version
      - name: Install compatible Android platform and NDK
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install 'platforms;android-34' 'build-tools;35.0.0' 'cmake;3.22.1' 'ndk;30.0.16248370'
          test -f "$ANDROID_HOME/ndk/30.0.16248370/source.properties"
      - name: Extract embedded Xiaomi Pad 6 patch and run tests
        run: |
          set -euo pipefail
          printf '%s' '' | base64 --decode | tar -xz
          python3 -m unittest discover -s pad6_ci/tests -v
      - name: Checkout verified DroidDeck runtime source
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/Droid-Deck/DroidDeck.git DroidDeck-PAD6
          git -C DroidDeck-PAD6 checkout --detach 6e57af02af31547d19c5007087f869524d1e05a4
          test "$(git -C DroidDeck-PAD6 rev-parse HEAD)" = '6e57af02af31547d19c5007087f869524d1e05a4'
      - name: Apply Pad 6 device-specific 60 FPS profile
        run: |
          set -euo pipefail
          python3 pad6_ci/apply_pad6.py DroidDeck-PAD6
          grep -F 'applicationId "com.pad6.pcgaming"' DroidDeck-PAD6/app/build.gradle
          grep -F 'Pad6Profile.applyOnce(this)' DroidDeck-PAD6/app/src/main/java/com/droiddeck/launcher/App.kt
      - name: Compile full native Android APK, Wine/Steam support components
        env:
          GH_TOKEN: ${{ github.token }}
          DROIDDECK_BUILD_VARIANT: release
        run: |
          set -euo pipefail
          cd DroidDeck-PAD6
          bash tools/build_local.sh
      - name: Check final APK identity, signatures and checksum
        run: |
          set -euo pipefail
          apk=DroidDeck-PAD6/app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          unzip -t "$apk" >/dev/null
          aapt="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -name aapt | sort -V | tail -1)"
          signer="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -name apksigner | sort -V | tail -1)"
          test -x "$aapt" && test -x "$signer"
          "$aapt" dump badging "$apk" | grep -F "package: name='com.pad6.pcgaming'"
          "$signer" verify --verbose --print-certs "$apk"
          sha256sum "$apk" | tee PAD6-PC-Gaming-SHA256.txt
          cp "$apk" PAD6-PC-Gaming-Stable60-v0.2.0.apk
      - name: Publish installable APK only after checks succeed
        uses: actions/upload-artifact@v4
        with:
          name: PAD6-PC-Gaming-Stable60-APK
          path: |
            PAD6-PC-Gaming-Stable60-v0.2.0.apk
            PAD6-PC-Gaming-SHA256.txt
          if-no-files-found: error
          retention-days: 30