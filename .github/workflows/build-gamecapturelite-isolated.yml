name: Build GameCaptureLite Isolated APK
on:
  push:
    branches:
      - gamecapturelite-build-20261104
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct standalone recorder project
        shell: bash
        run: |
          mkdir -p GameCaptureLite
          base64 -d isolated-gamecapturelite/source.zip.base64 > /tmp/gamecapture_source.zip
          unzip -q /tmp/gamecapture_source.zip -d GameCaptureLite
          test -f GameCaptureLite/app/src/main/java/com/gamecapture/lite/RecordingEngine.java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install required Android SDK
        run: |
          echo "Preinstalled SDK: $ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify compile & package APK
        working-directory: GameCaptureLite
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK exists
        run: test -s GameCaptureLite/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: GameCaptureLite-XiaomiPad6-debug-APK
          path: GameCaptureLite/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 15
