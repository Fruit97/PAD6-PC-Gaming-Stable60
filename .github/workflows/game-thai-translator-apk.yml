name: Build Game Thai Translator v1.2 Floating APK
on:
  push:
    branches:
      - game-thai-translator-v1.2-floating-controls
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Restore source and verify checksum
        run: |
          python -m pip install brotli
          python - <<'PY'
          import hashlib, base64, brotli, io, tarfile, pathlib
          parts = [pathlib.Path(f'payload/source.part{i:02}.b64').read_text() for i in range(1,4)]
          combined = ''.join(parts)
          expected = '073d2fed9e652caca178b044edd625c47a45648e0ed80953c3c17da9c4a4ee6a'
          actual = hashlib.sha256(combined.encode('ascii')).hexdigest()
          if actual != expected:
              raise ValueError(f'Source checksum mismatch: {actual}')
          data = brotli.decompress(base64.b64decode(combined))
          with tarfile.open(fileobj=io.BytesIO(data)) as archive:
              archive.extractall(path='.')
          print('Source checksum passed; Android project restored.')
          patch_parts = [pathlib.Path('payload/v12-patch.part01.b64').read_text(), pathlib.Path('payload/v12-patch.part02.b64').read_text()]
          patch_string = ''.join(patch_parts)
          patch_sha = hashlib.sha256(patch_string.encode('ascii')).hexdigest()
          assert patch_sha == '15494d9c0f144210d4356fc64e0677209720fa2f5ee9501d13adce4b81f18249', patch_sha
          import subprocess
          delta = brotli.decompress(base64.b64decode(patch_string))
          subprocess.run(['patch', '--batch', '-p1'], input=delta, check=True)
          print('Floating service patch applied and checked.')
          PY
      - name: Install Android SDK 35
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDK_MANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)
          test -x "$SDK_MANAGER"
          yes | "$SDK_MANAGER" --licenses >/dev/null || true
          "$SDK_MANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Inspect APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GameThaiTranslator-v1.2-Floating-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
