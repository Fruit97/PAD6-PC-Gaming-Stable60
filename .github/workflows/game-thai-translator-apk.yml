name: Build Game Thai Translator v1.7 Continuous Voice APK
on:
  push:
    branches:
      - game-thai-translator-v1.7-continuous-voice
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Restore source and verify checksum
        run: |
          python -m pip install brotli
          python - <<'PY'
          import hashlib, base64, brotli, io, tarfile, pathlib
          parts = [pathlib.Path(f'payload/source.part{i:02}.b64').read_text() for i in range(1,4)]
          combined = ''.join(parts)
          expected = '073d2fed9e652caca178b044edd625c47a45648e0ed80953c3c17da9c4a4ee6a'
          actual = hashlib.sha256(combined.encode('ascii')).hexdigest()
          if actual != expected:
              raise ValueError(f'Source checksum mismatch: {actual}')
          data = brotli.decompress(base64.b64decode(combined))
          with tarfile.open(fileobj=io.BytesIO(data)) as archive:
              archive.extractall(path='.')
          print('Source checksum passed; Android project restored.')
          patch_parts = [pathlib.Path('payload/v12-patch.part01.b64').read_text(), pathlib.Path('payload/v12-patch.part02.b64').read_text()]
          patch_string = ''.join(patch_parts)
          patch_sha = hashlib.sha256(patch_string.encode('ascii')).hexdigest()
          assert patch_sha == '15494d9c0f144210d4356fc64e0677209720fa2f5ee9501d13adce4b81f18249', patch_sha
          import subprocess
          delta = brotli.decompress(base64.b64decode(patch_string))
          subprocess.run(['patch', '--batch', '-p1'], input=delta, check=True)
          print('Floating service patch applied and checked.')
          v13_text = pathlib.Path('payload/v13-minimize.b64').read_text()
          sha = hashlib.sha256(v13_text.encode('ascii')).hexdigest()
          assert sha == 'e0d4968b5c458c704b975b6ce10398086b40b34d7371248d15ac8c9bf1894428', sha
          delta13 = brotli.decompress(base64.b64decode(v13_text))
          subprocess.run(['patch', '--batch', '-p1'], input=delta13, check=True)
          print('v1.3 collapse and expand patch applied.')
          v14_text = ''.join(pathlib.Path(f'payload/v14-chat.part0{i}.b64').read_text() for i in range(1,3))
          patch_hash = hashlib.sha256(v14_text.encode('ascii')).hexdigest()
          assert patch_hash == '5c9baa2a9e17a2f45334b27021ba22e1e40d528f2a8f6ee0eccd8e8abb73cfb2', patch_hash
          delta14 = brotli.decompress(base64.b64decode(v14_text))
          subprocess.run(['patch', '--batch', '-p1'], input=delta14, check=True)
          print('v1.4 natural chat keyboard + swear phrase dictionary applied.')
          patch15 = ''.join(pathlib.Path(f'payload/v15-voice.part0{i}.b64').read_text() for i in range(1,4))
          digest15 = hashlib.sha256(patch15.encode('ascii')).hexdigest()
          assert digest15 == '56313e5cc9c2e2b496902fec6b617096a123623465690dc7be2fdbcc27c507e6', digest15
          # v1.4 source export included an unused Build import absent from the
          # generated branch's reconstruction; normalize before applying patch.
          keyboard = pathlib.Path('app/src/main/java/com/example/gamethaitranslator/ChatKeyboardService.java')
          code = keyboard.read_text()
          if 'import android.os.Build;' not in code:
              keyboard.write_text(code.replace('import android.text.InputType;',
                                                   'import android.text.InputType;' + chr(10) + 'import android.os.Build;'))
          delta15 = brotli.decompress(base64.b64decode(patch15))
          subprocess.run(['patch','--batch','-p2'],input=delta15,check=True)
          print('v1.5 voice typing, revised keyboard and runtime microphone permission applied.')
          subprocess.run(['python','payload/v16_uncensored.py'],check=True)
          subprocess.run(['python','payload/v17_prepare.py'],check=True)
          PY
      - name: Install Android SDK 35
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDK_MANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)
          test -x "$SDK_MANAGER"
          yes | "$SDK_MANAGER" --licenses >/dev/null || true
          "$SDK_MANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Inspect APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GameThaiTranslator-v1.7-ContinuousVoice-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
